<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="融合 Agent、长短期记忆与 RAG 的私人关系记忆助手" />
    <title>MemoryMate AI 私人记忆助手</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">AI</div>
          <div>
            <strong>MemoryMate AI</strong>
            <span>私人关系记忆助手</span>
          </div>
        </div>

        <section class="side-section" aria-labelledby="identity-title">
          <div class="section-heading">
            <h2 id="identity-title">会话身份</h2>
          </div>
          <label class="field">
            <span>用户 ID</span>
            <input id="userId" type="text" autocomplete="off" maxlength="80" />
          </label>
          <label class="field">
            <span>当前对象 ID</span>
            <input id="subjectId" type="text" autocomplete="off" maxlength="80" placeholder="妈妈、爸爸、对象……" />
          </label>
          <label class="field">
            <span>会话 ID</span>
            <div class="input-action">
              <input id="threadId" type="text" autocomplete="off" maxlength="80" />
              <button class="icon-button" id="newThreadButton" type="button" title="创建新会话" aria-label="创建新会话">+</button>
            </div>
          </label>
          <button class="secondary-button danger" id="clearThreadButton" type="button">清空当前会话</button>
        </section>

        <section class="side-section identity-picker" aria-labelledby="picker-title">
          <div class="section-heading">
            <h2 id="picker-title">快捷选择</h2>
            <span class="section-tag">ID</span>
          </div>
          <label class="field">
            <span>登录账号</span>
            <div class="input-action">
              <select id="userSelector" aria-label="选择登录账号"></select>
              <button class="icon-button" id="addUserButton" type="button" title="添加账号" aria-label="添加账号">+</button>
            </div>
          </label>
          <label class="field">
            <span>知识范围</span>
            <div class="input-action">
              <select id="subjectSelector" aria-label="选择知识范围"></select>
              <button class="icon-button" id="addSubjectButton" type="button" title="添加对象" aria-label="添加对象">+</button>
              <button class="icon-button danger-icon" id="deleteSubjectButton" type="button" title="删除对象及资料" aria-label="删除对象及资料">−</button>
            </div>
          </label>
          <button class="secondary-button graph-button" id="graphButton" type="button">查看知识图谱</button>
        </section>

        <section class="side-section conversation-list-section" aria-labelledby="conversations-title">
          <div class="section-heading">
            <h2 id="conversations-title">会话记录</h2>
            <span class="section-tag">LOCAL</span>
          </div>
          <button class="secondary-button new-conversation-button" id="newConversationButton" type="button">+ 新对话</button>
          <div class="conversation-capacity" id="conversationCapacity"></div>
          <div class="conversation-list" id="conversationList" aria-live="polite"></div>
        </section>

        <section class="side-section" aria-labelledby="knowledge-title">
          <div class="section-heading">
            <h2 id="knowledge-title">关系备忘录</h2>
            <span class="section-tag">RAG</span>
          </div>
          <label class="upload-zone" id="uploadZone" for="knowledgeFiles">
            <span class="upload-symbol" aria-hidden="true">+</span>
            <strong>添加关系笔记</strong>
            <span>可多选，格式由服务端配置决定</span>
          </label>
          <input id="knowledgeFiles" class="visually-hidden" type="file" multiple />
          <div class="file-summary" id="fileSummary" aria-live="polite">尚未选择文件</div>
          <button class="secondary-button" id="uploadButton" type="button" disabled>保存到备忘录</button>
          <div class="upload-progress" id="uploadProgress" hidden>
            <span></span>
          </div>
        </section>

        <div class="sidebar-footer">
          <div class="status-line">
            <span class="status-dot is-checking" id="statusDot"></span>
            <span id="statusText">正在检查服务</span>
          </div>
          <button class="text-button" id="refreshStatusButton" type="button">刷新</button>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button class="icon-button menu-button" id="menuButton" type="button" aria-label="打开侧栏">☰</button>
          <div>
            <h1>私人关系记忆助手</h1>
            <p>家人 · 恋人 · 朋友 · 个性化记忆</p>
          </div>
          <div class="model-state">
            <span>运行模式</span>
            <strong id="runtimeMode">读取中</strong>
          </div>
        </header>

        <section class="conversation" id="conversation" aria-live="polite">
          <div class="empty-state" id="emptyState">
            <div class="empty-mark" aria-hidden="true">A</div>
            <h2>开始一次私人对话</h2>
            <p>选择一个关系对象，查询资料、回忆重要时刻，或确认保存新的喜好和雷区。</p>
            <div class="suggestions">
              <button type="button" data-prompt="我的对象叫什么？她的生日是什么时候？请先检索恋爱备忘录。">查询对象资料</button>
              <button type="button" data-prompt="今天我们吃饭时发现她不喜欢吃折耳根，请整理成待确认记忆。">记录新的雷区</button>
              <button type="button" data-prompt="请记住：我正在学习 LangChain，并说明你会如何使用这条长期记忆。">测试长期记忆</button>
            </div>
          </div>
        </section>

        <footer class="composer-area">
          <form class="composer" id="chatForm">
            <textarea id="messageInput" rows="1" maxlength="8000" placeholder="输入问题，Enter 发送，Shift + Enter 换行" aria-label="消息内容"></textarea>
            <button class="send-button" id="sendButton" type="submit" aria-label="发送消息" title="发送">
              <span aria-hidden="true">↑</span>
            </button>
          </form>
          <p class="composer-hint">回答可能存在偏差，重要信息请结合来源核验。</p>
        </footer>
      </main>
    </div>

    <div class="mobile-overlay" id="mobileOverlay" hidden></div>
    <div class="graph-modal" id="graphModal" hidden>
      <div class="graph-dialog" role="dialog" aria-modal="true" aria-labelledby="graphTitle">
        <header class="graph-header">
          <div>
            <span class="eyebrow">KNOWLEDGE GRAPH</span>
            <h2 id="graphTitle">人物知识图谱</h2>
          </div>
          <button class="icon-button" id="closeGraphButton" type="button" aria-label="关闭知识图谱">×</button>
        </header>
        <div class="graph-body">
          <div class="graph-canvas" id="graphCanvas"></div>
          <aside class="graph-detail" id="graphDetail">
            <div class="graph-detail-empty">点击人物节点查看已保存资料</div>
          </aside>
        </div>
      </div>
    </div>
    <div class="toast-region" id="toastRegion" aria-live="assertive"></div>
    <script src="app.js" defer></script>
  </body>
</html>
